{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | SaaS Command Center</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="{% static 'saas_hub/css/hub.css' %}?v=20261017_v4">
</head>
<body>

    <div class="login-wrap">
        <div class="login-card">
            
            <div class="login-brand">
                <div class="login-brand-logo">
                    <i data-lucide="shield-check" style="width: 26px; height: 26px; color: var(--t1);"></i>
                </div>
                <h1>SaaS Command Center</h1>
                <p>Авторизация Создателя / Супер-Администратора</p>
            </div>

            {% if error %}
            <div class="alert-error">
                <i data-lucide="alert-triangle" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">

                <div class="form-group">
                    <label class="form-label" for="username">Имя пользователя (Логин):</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="admin" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Мастер-пароль:</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 0.95rem; margin-top: 10px;">
                    <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
                    <span>Войти в Командный Центр</span>
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px;">
                <a href="https://asatkhanov.uz" style="color: var(--t2); font-size: 0.82rem; text-decoration: none;">
                    &larr; Вернуться на asatkhanov.uz
                </a>
            </div>

        </div>
    </div>

    <!-- Core Scripts -->
    <script src="{% static 'saas_hub/js/hub.js' %}?v=20261017_v4"></script>
</body>
</html>
