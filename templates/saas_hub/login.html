{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | SaaS Command Center</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="{% static 'saas_hub/css/hub.css' %}">
    
    <style>
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 50% 20%, #171717 0%, #0a0a0a 70%);
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        .login-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
        }

        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 28px;
        }

        .login-brand-logo {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #262626 0%, #171717 100%);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .login-brand h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .login-brand p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--color-red);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="login-wrap">
        <div class="login-card">
            
            <div class="login-brand">
                <div class="login-brand-logo">
                    <i data-lucide="shield-check" style="width: 26px; height: 26px; color: #38bdf8;"></i>
                </div>
                <h1>SaaS Command Center</h1>
                <p>Авторизация Создателя / Супер-Администратора</p>
            </div>

            {% if error %}
            <div class="alert-error">
                <i data-lucide="alert-triangle" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">

                <div class="form-group">
                    <label class="form-label" for="username">Имя пользователя (Логин):</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="admin" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Мастер-пароль:</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 0.95rem; margin-top: 10px;">
                    <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
                    Войти в Командный Центр
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px;">
                <a href="https://asatkhanov.uz" style="color: var(--text-muted); font-size: 0.82rem; text-decoration: none;">
                    &larr; Вернуться на asatkhanov.uz
                </a>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });
    </script>
</body>
</html>
